name: Feature request
description: Suggest an improvement or a new capability for Index Info.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea. Please search existing issues first to avoid duplicates.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the workflow or limitation that prompted the request.
      placeholder: I want to compare optical constants for two materials at the same wavelength.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the feature or behaviour you would find useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Tell us about workarounds or other solutions, if any.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sketches, screenshots, references, or other helpful details.
